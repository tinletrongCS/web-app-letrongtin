<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4 text-center">Chi Tiết Sinh Viên</h2>

            <div class="card shadow-sm border-0" th:if="${sinhVien != null}">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${sinhVien.name}">Tên Sinh Viên</h5>
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tbody>
                        <tr>
                            <th style="width: 30%">Mã Sinh Viên:</th>
                            <td th:text="${sinhVien.id}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${sinhVien.email}"></td>
                        </tr>
                        <tr>
                            <th>Tuổi:</th>
                            <td th:text="${sinhVien.age}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white text-end">
                    <a th:href="@{/students/edit/{id}(id=${sinhVien.id})}" class="btn btn-warning shadow-sm">Chỉnh Sửa</a>

                    <form th:action="@{/students/delete/{id}(id=${sinhVien.id})}" method="POST" class="d-inline" onsubmit="return confirm('Anh có chắc chắn muốn xóa sinh viên này không? Dữ liệu không thể khôi phục!');">
                        <button type="submit" class="btn btn-danger shadow-sm">Xóa</button>
                    </form>
                </div>
            </div>

            <div class="alert alert-danger mt-3 text-center" th:if="${sinhVien == null}">
                Không tìm thấy dữ liệu sinh viên!
            </div>

            <div class="mt-4 text-center">
                <a href="/students" class="btn btn-secondary shadow-sm">⬅ Quay Lại Danh Sách</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
