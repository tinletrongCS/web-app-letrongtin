<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${student.id == null || student.id == ''} ? 'Thêm Sinh Viên Mới' : 'Chỉnh Sửa Sinh Viên'"></title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; max-width: 400px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; cursor: pointer; color: white; border-radius: 4px; text-decoration: none;}
        .btn-save { background-color: #4CAF50; }
        .btn-cancel { background-color: #f44336; margin-left: 10px; }
    </style>
</head>
<body>
<h1 th:text="${student.id == null || student.id == ''} ? 'Thêm Sinh Viên Mới' : 'Chỉnh Sửa Thông Tin'"></h1>

<form th:action="@{${(student.id == null or student.id == '') ? '/students/create' : '/students/edit/' + student.id}}"
      th:object="${student}" method="POST">

    <div class="form-group">
        <label>ID Sinh Viên:</label>
        <input type="text" th:field="*{id}"
               th:readonly="${student.id != null && student.id != ''}"
               th:style="${student.id != null && student.id != '' ? 'background-color: #e9ecef;' : ''}"
               required />
    </div>

    <div class="form-group">
        <label>Họ và Tên:</label>
        <input type="text" th:field="*{name}" required />
    </div>

    <div class="form-group">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required />
    </div>

    <div class="form-group">
        <label>Tuổi:</label>
        <input type="number" th:field="*{age}" required />
    </div>

    <div>
        <button type="submit" class="btn btn-save">Lưu Thông Tin</button>
        <a th:href="@{/students}" class="btn btn-cancel">Hủy Bỏ</a>
    </div>
</form>
</body>
</html>
