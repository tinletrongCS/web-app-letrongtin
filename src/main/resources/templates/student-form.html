<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${student.id == null || student.id == ''} ? 'Thêm Sinh Viên Mới' : 'Chỉnh Sửa Sinh Viên'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0 text-center" th:text="${student.id == null || student.id == ''} ? 'Thêm Sinh Viên Mới' : 'Chỉnh Sửa Thông Tin'"></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{${(student.id == null or student.id == '') ? '/students/create' : '/students/edit/' + student.id}}"
                          th:object="${student}" method="POST">

                        <div class="mb-3">
                            <label class="form-label fw-bold">ID Sinh Viên <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{id}" class="form-control"
                                   th:readonly="${student.id != null && student.id != ''}"
                                   th:classappend="${student.id != null && student.id != '' ? 'bg-light' : ''}"
                                   placeholder="Ví dụ: SV001" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập họ và tên đầy đủ" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Tuổi <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{age}" class="form-control" placeholder="Nhập số tuổi" required min="1" />
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/students}" class="btn btn-secondary me-md-2">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-success">💾 Lưu Thông Tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
